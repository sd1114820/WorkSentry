server:
  addr: ":8080"
  read_timeout_seconds: 15
  write_timeout_seconds: 15
  idle_timeout_seconds: 60

database:
  dsn: "root:password@tcp(127.0.0.1:3306)/worksentry?parseTime=true&loc=Local&charset=utf8mb4"

mq:
  enabled: false
  provider: "kafka"
  brokers:
    - "127.0.0.1:9092"
  topic: "worksentry.client.reports"
  write_timeout_seconds: 3

app:
  timezone: "Asia/Shanghai"
  environment: "dev"
  # 0 表示长期保留 raw_events；取消对象存储归档后建议保持 0。
  raw_event_retention_days: 0
  admin:
    username: "admin"
    password: "admin123"
    display_name: "管理员"
